name: LifeOS 4.6.2 One-Shot Rule Fixture Repair

on:
  push:
    branches:
      - feature/lifeos-462-master-spec-certification
    paths:
      - .github/workflows/lifeos-462-rule-fixture-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lifeos-462-master-spec-certification
          fetch-depth: 0
      - name: Move retained RuleEngine hard-constraint fixture to tomorrow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='tests/decision-461-completion.spec.js';
          let s=fs.readFileSync(path,'utf8');
          const marker="test('matched automatic RuleEngine placement rule becomes a hard constraint'";
          const start=s.indexOf(marker);
          if(start<0) throw new Error('RuleEngine retained test not found');
          const end=s.indexOf("\n\n  test(",start+marker.length);
          if(end<0) throw new Error('RuleEngine retained test end not found');
          let block=s.slice(start,end);
          const old="const date=LifeOS.CoreUtil.localDate(),context=await new LifeOS.DecisionContextBuilder().build";
          const next="const date=LifeOS.CoreUtil.addDays(LifeOS.CoreUtil.localDate(),1),context=await new LifeOS.DecisionContextBuilder().build";
          if(!block.includes(next)){
            if(!block.includes(old)) throw new Error('Expected RuleEngine date fixture not found');
            block=block.replace(old,next);
            s=s.slice(0,start)+block+s.slice(end);
            fs.writeFileSync(path,s);
          }
          const verify=fs.readFileSync(path,'utf8').slice(start,end+64);
          if(!verify.includes(next)) throw new Error('Tomorrow RuleEngine fixture was not written');
          NODE
          node --check tests/decision-461-completion.spec.js
          rm .github/workflows/lifeos-462-rule-fixture-repair.yml
      - name: Commit repaired fixture and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/decision-461-completion.spec.js .github/workflows/lifeos-462-rule-fixture-repair.yml
          git diff --cached --check
          git commit -m "test(4.6.2): keep RuleEngine constraint fixture time-independent"
          git push origin HEAD:feature/lifeos-462-master-spec-certification
