name: LifeOS 4.5.1 Apply Final Semantic Corrections

on:
  push:
    branches:
      - fix/lifeos-451-final-automation-completion

permissions:
  contents: write

concurrency:
  group: lifeos-451-final-corrections-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded 4.5.1 correction chain
        run: |
          node scripts/repair-lifeos-451-patcher.mjs
          node scripts/apply-lifeos-451-final-automation.mjs
          node scripts/apply-lifeos-451-final-corrections.mjs
          node scripts/repair-lifeos-451-patcher.mjs
          node scripts/apply-lifeos-451-final-automation.mjs
      - name: Parse corrected release-critical source
        run: |
          node --check app.js
          node --check service-worker.js
          node --check planning-worker.js
          node --check scripts/apply-lifeos-451-final-automation.mjs
          node --check scripts/apply-lifeos-451-final-corrections.mjs
          node --check scripts/repair-lifeos-451-patcher.mjs
          node --check scripts/static-qa-451.mjs
          node --check tests/rules-451-completion.spec.js
      - name: Verify semantic correction markers
        run: |
          grep -F 'async isExplicitHistoryReplay(stores)' app.js
          grep -F 'if(await this.isExplicitHistoryReplay(stores))' app.js
          grep -F 'emittedShortfalls=[];' tests/rules-451-completion.spec.js
          grep -F 'explicit Undo/Redo automation suppression' scripts/static-qa-451.mjs
          grep -F 'LIFEOS_451_CORRECTION_CHILD' scripts/repair-lifeos-451-patcher.mjs
      - name: Commit generated corrected source
        run: |
          if git diff --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js tests/rules-451-completion.spec.js scripts/static-qa-451.mjs scripts/repair-lifeos-451-patcher.mjs scripts/apply-lifeos-451-final-corrections.mjs
          git commit -m 'fix(4.5.1): preserve explicit undo and certify project shortfall producer'
          git push origin HEAD:fix/lifeos-451-final-automation-completion
