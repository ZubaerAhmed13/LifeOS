name: Recover clean LifeOS 4.6.2 source
on:
  push:
    branches:
      - feature/lifeos-462-master-spec-certification
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lifeos-462-master-spec-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore certified 4.6.1 source and regenerate 4.6.2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- app.js decision-engine.js app.css index.html service-worker.js manifest.webmanifest
          node --check scripts/upgrade-lifeos-462-master-spec.mjs
          node scripts/upgrade-lifeos-462-master-spec.mjs
          node --check app.js
          node --check decision-engine.js
          node --check service-worker.js
          node --check planning-worker.js
          node --check tests/decision-462-master-spec.spec.js
          node scripts/static-qa-462.mjs
          node scripts/upgrade-lifeos-462-master-spec.mjs
          git diff --check
      - name: Commit clean generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js decision-engine.js app.css index.html service-worker.js manifest.webmanifest
          git commit -m 'chore(4.6.2): recover and freeze clean master-spec source'
          git push origin HEAD:feature/lifeos-462-master-spec-certification
