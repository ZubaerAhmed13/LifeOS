name: LifeOS 4.5 Implementation Gate

on:
  push:
    branches:
      - feature/lifeos-450-rules-automation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifeos-450-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tighten guarded App constructor anchor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/apply-lifeos-450-core.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldLine = `app = replaceOnce(app, "this.calendarFocusKey=''", "this.calendarFocusKey='';this.ruleEngine=null;this.pendingRuleSuggestion=null;this.ruleTestResult=null", 'App rule state');`;
          const newLine = `app = replaceOnce(app, "this.calendarScenarioUndo=[];this.calendarFocusKey=''}", "this.calendarScenarioUndo=[];this.calendarFocusKey='';this.ruleEngine=null;this.pendingRuleSuggestion=null;this.ruleTestResult=null}", 'App rule state');`;
          if (source.includes(oldLine)) {
            source = source.replace(oldLine, newLine);
            fs.writeFileSync(path, source);
            console.log('Tightened App constructor patch guard.');
          } else if (source.includes(newLine)) {
            console.log('App constructor patch guard already tightened.');
          } else {
            throw new Error('Expected App constructor patcher signature not found.');
          }
          NODE
      - name: Apply guarded 4.5 core patch
        run: node scripts/apply-lifeos-450-core.mjs
      - name: Apply guarded 4.5 UI and test patch
        run: node scripts/apply-lifeos-450-ui-tests-v2.mjs
      - name: Parse generated production JavaScript
        run: |
          node --check app.js
          node --check service-worker.js
          node --check planning-worker.js
      - name: Verify release identity and safety invariants
        run: |
          grep -F "const APP_VERSION='4.5.0';" app.js
          grep -F "const RULE_ENGINE_VERSION='4.5.0';" app.js
          grep -F "const DB_SCHEMA_VERSION=16;" app.js
          grep -F "const INTELLIGENCE_MODEL_VERSION='4.4.2';" app.js
          grep -F "class RuleEngine{" app.js
          grep -F "Rules & Automation" app.js
          grep -F "async runRule450Tests(repo)" app.js
          ! grep -E '\beval\s*\(' app.js
          ! grep -E '\bnew\s+Function\s*\(' app.js
      - name: Commit generated 4.5 source when needed
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Guarded patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css service-worker.js index.html manifest.webmanifest scripts/apply-lifeos-450-core.mjs
          git commit -m "feat: implement LifeOS 4.5 rules automation core"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Gate result
        run: |
          echo "Implementation changed source: ${{ steps.commit.outputs.changed }}"
          echo "Head input SHA: $GITHUB_SHA"
