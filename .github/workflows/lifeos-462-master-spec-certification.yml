name: LifeOS 4.6.2 Master-Spec Certification Completion

on:
  push:
    branches:
      - feature/lifeos-462-master-spec-certification
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lifeos-462-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact_source:
    name: Generate and freeze exact 4.6.2 source
    runs-on: ubuntu-24.04
    outputs:
      certified_sha: ${{ steps.freeze.outputs.certified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse guarded 4.6.2 generator and QA
        run: |
          node --check scripts/upgrade-lifeos-462-master-spec.mjs
          node --check scripts/static-qa-462.mjs
          node --check scripts/build-release-462.mjs
          node --check tests/decision-462-master-spec.spec.js
      - name: Generate and freeze exact protected source
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          node scripts/upgrade-lifeos-462-master-spec.mjs
          if ! git diff --quiet -- app.js decision-engine.js app.css index.html service-worker.js manifest.webmanifest; then
            if [ "${GITHUB_REF_NAME}" != "feature/lifeos-462-master-spec-certification" ]; then
              echo 'Generated 4.6.2 source is dirty on main. Refusing release.' >&2
              git diff -- app.js decision-engine.js app.css index.html service-worker.js manifest.webmanifest
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app.js decision-engine.js app.css index.html service-worker.js manifest.webmanifest
            git commit -m 'chore(4.6.2): freeze master-spec certification source'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          CERTIFIED_SHA="$(git rev-parse HEAD)"
          echo "certified_sha=${CERTIFIED_SHA}" >> "$GITHUB_OUTPUT"
          echo "CERTIFIED_SHA=${CERTIFIED_SHA}"
      - name: Prove 4.6.2 generator is idempotent
        run: |
          node scripts/upgrade-lifeos-462-master-spec.mjs
          git diff --exit-code
      - name: Parse all release-critical JavaScript
        run: |
          node --check app.js
          node --check decision-engine.js
          node --check service-worker.js
          node --check planning-worker.js
          node --check tests/decision-460.spec.js
          node --check tests/decision-performance-460.spec.js
          node --check tests/decision-461-completion.spec.js
          node --check tests/decision-462-master-spec.spec.js
      - name: Verify version and preserved engine identities
        run: |
          grep -F "const APP_VERSION='4.6.2';" app.js
          grep -F "const DECISION_ENGINE_VERSION='4.6.2';" app.js
          grep -F "const DECISION_ENGINE_VERSION='4.6.2';" decision-engine.js
          grep -F "const DECISION_MASTER_SPEC_MARKER='4.6.2';" decision-engine.js
          grep -F "const RULE_ENGINE_VERSION='4.5.1';" app.js
          grep -F "const INTELLIGENCE_MODEL_VERSION='4.4.2';" app.js
          grep -F "const CALENDAR_ENGINE_VERSION='4.3.0';" app.js
          grep -F "const FORECAST_MODEL_VERSION='4.2.0';" app.js
          grep -F "const SCHEDULER_VERSION='4.1.0';" app.js
          grep -F "const RULE_SCHEMA_VERSION=1;" app.js
          grep -F "const DB_SCHEMA_VERSION=16;" app.js

  static:
    name: Behavioral master-spec static QA and PWA parity
    needs: exact_source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact_source.outputs.certified_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run behavioral 4.6.2 static QA
        shell: bash
        run: |
          set -o pipefail
          node scripts/static-qa-462.mjs | tee static-qa-462.log
      - name: Build synchronized PWA and standalone from exact SHA
        env:
          LIFEOS_SOURCE_SHA: ${{ needs.exact_source.outputs.certified_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-release-462.mjs | tee build-parity-462.log
          grep -F "SOURCE_COMMIT ${{ needs.exact_source.outputs.certified_sha }}" build-parity-462.log
          node -e "const p=require('./dist/BUILD_PROVENANCE.json');for(const k of ['decisionInternalGroups','decisionTwoTabE2E','keyboardDecisionFlow','offlineDecisionApplyUndo','currentVsProposedPreview','morningDecisionBrief','endOfDayDecisionReview','decisionOutcomeFollowUp'])if(!p[k])throw Error(k)"
      - name: Upload static evidence
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-462-static-qa
          path: |
            static-qa-462.log
            build-parity-462.log
            dist/BUILD_PROVENANCE.json
            dist/SHA256SUMS.txt
          retention-days: 30

  browser:
    name: ${{ matrix.browser }} exact-SHA master-spec certification
    needs: exact_source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      LIFEOS_BROWSER: ${{ matrix.browser }}
      CERTIFIED_SHA: ${{ needs.exact_source.outputs.certified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact_source.outputs.certified_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact-source harness from retained LifeOS suite
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin verify-lifeos-440-ci:refs/remotes/origin/verify-lifeos-440-ci
          git archive origin/verify-lifeos-440-ci verify-440 | tar -x
          rm -rf verify-440/pwa
          mkdir -p verify-440/pwa verify-440/reports
          cp index.html app.js decision-engine.js app.css planning-worker.js service-worker.js manifest.webmanifest verify-440/pwa/
          cp -R icons verify-440/pwa/icons
          for file in evidence-correctness.spec.js rules-450.spec.js rule-performance-450.spec.js rule-approval-safety-450.spec.js rules-451-completion.spec.js decision-460.spec.js decision-performance-460.spec.js decision-461-completion.spec.js decision-462-master-spec.spec.js; do cp "tests/$file" "verify-440/tests/$file"; done
          node <<'NODE'
          const fs=require('fs');
          const required=(source,oldValue,newValue,label)=>{if(source.includes(newValue))return source;if(!source.includes(oldValue))throw new Error(`Harness alignment failed: ${label}`);return source.replace(oldValue,newValue)};
          const configPath='verify-440/playwright.config.cjs';let config=fs.readFileSync(configPath,'utf8');
          config=required(config,"testMatch: ['calendar-430.spec.js', 'intelligence-440.spec.js', 'pwa.spec.js']","testMatch: ['calendar-430.spec.js', 'intelligence-440.spec.js', 'pwa.spec.js', 'evidence-correctness.spec.js', 'rules-450.spec.js', 'rule-performance-450.spec.js', 'rule-approval-safety-450.spec.js', 'rules-451-completion.spec.js', 'decision-460.spec.js', 'decision-performance-460.spec.js', 'decision-461-completion.spec.js', 'decision-462-master-spec.spec.js']",'Playwright testMatch');
          if(!config.includes('retries: 0'))throw new Error('Certification requires retries: 0.');fs.writeFileSync(configPath,config);
          const patch=(file,fn)=>{const p='verify-440/tests/'+file;fs.writeFileSync(p,fn(fs.readFileSync(p,'utf8')))};
          patch('calendar-430.spec.js',s=>s.replace(/app: '4\.4\.0'/g,"app: '4.6.2'"));
          patch('intelligence-440.spec.js',s=>s.replace(/app: '4\.4\.0'/g,"app: '4.6.2'").replace(/intelligence: '4\.4\.1'/g,"intelligence: '4.4.2'").replace(/model 4\\\.4\\\.1/g,'model 4\\.4\\.2'));
          patch('pwa.spec.js',s=>s.replaceAll('lifeos-shell-4.4.0-','lifeos-shell-4.6.2-'));
          patch('evidence-correctness.spec.js',s=>s.replace("appVersion: '4.5.1'","appVersion: '4.6.2'"));
          patch('rules-450.spec.js',s=>s.replace("app: '4.5.1'","app: '4.6.2'"));
          patch('rules-451-completion.spec.js',s=>s.replace("expect(coverage.version).toBe('4.5.1');","expect(coverage.version).toBe('4.6.2');"));
          patch('decision-460.spec.js',s=>s.replaceAll("'4.6.0'","'4.6.2'").replaceAll('DECISION-STALE-460','DECISION-STALE-461'));
          patch('decision-461-completion.spec.js',s=>s.replaceAll("'4.6.1'","'4.6.2'").replaceAll('data-decision-what-now-evidence="4.6.1"','data-decision-what-now-evidence="4.6.2"'));
          const packagePath='verify-440/package.json',pkg=JSON.parse(fs.readFileSync(packagePath,'utf8'));pkg.name='lifeos-4-6-2-master-spec-certification';pkg.version='4.6.2';fs.writeFileSync(packagePath,JSON.stringify(pkg,null,2)+'\n');
          NODE
          grep -F 'retries: 0' verify-440/playwright.config.cjs
          grep -F 'decision-462-master-spec.spec.js' verify-440/playwright.config.cjs
          test "$(sha256sum app.js | awk '{print $1}')" = "$(sha256sum verify-440/pwa/app.js | awk '{print $1}')"
          test "$(sha256sum decision-engine.js | awk '{print $1}')" = "$(sha256sum verify-440/pwa/decision-engine.js | awk '{print $1}')"
      - name: Install certification dependencies
        working-directory: verify-440
        run: npm install --no-audit --no-fund
      - name: Install real browser runtime
        working-directory: verify-440
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run retained plus master-spec browser certification
        working-directory: verify-440
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm test 2>&1 | tee "reports/${LIFEOS_BROWSER}-test.log"
      - name: Certify zero-failure master-spec evidence
        if: success()
        working-directory: verify-440
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),browser=process.env.LIFEOS_BROWSER,report=JSON.parse(fs.readFileSync(`reports/${browser}-results.json`,'utf8')),stats=report.stats||{},passed=Number(stats.expected||0),failed=Number(stats.unexpected||0),skipped=Number(stats.skipped||0),flaky=Number(stats.flaky||0);
          if(failed||skipped||flaky)throw new Error(`Non-green: passed=${passed} failed=${failed} skipped=${skipped} flaky=${flaky}`);if(passed!==102)throw new Error(`Expected 102 Playwright tests, got ${passed}.`);
          const log=fs.readFileSync(`reports/${browser}-test.log`,'utf8'),internal=log.match(/LIFEOS_INTERNAL_SELF_TEST\s+(\d+)\/(\d+)\s+EvidenceComparison\s+(\d+\/\d+)/),ruleGroups=log.match(/LIFEOS_RULE_GROUPS\s+(.+)/),decisionGroups=log.match(/LIFEOS_DECISION_GROUPS\s+(.+)/),decisionPerf=[...log.matchAll(/LIFEOS_DECISION_PERF[^\n]+/g)].map(x=>x[0]);
          if(!internal||internal[1]!==internal[2]||Number(internal[2])<509)throw new Error(`Extended internal suite not green: ${internal?.[1]}/${internal?.[2]}`);if(internal[3]!=='7/7')throw new Error(`Evidence comparison not 7/7: ${internal[3]}`);
          if(!ruleGroups)throw new Error('Missing Rule group marker.');const rules=JSON.parse(ruleGroups[1]),badRules=Object.entries(rules).filter(([,v])=>v.passed!==v.total);if(badRules.length)throw new Error(`Rule groups not green: ${JSON.stringify(badRules)}`);
          if(!decisionGroups)throw new Error('Missing Decision group marker.');const decisions=JSON.parse(decisionGroups[1]),required=['Decision Context','Decision Fingerprint','Decision Candidate Generation','Decision Feasibility','Decision Trade-offs','Decision Ranking','Decision Preview','Decision Atomicity','Decision Concurrency','Decision Scenario','Decision Data Quality','Decision Privacy','Decision Brief','Decision Outcome'],missing=required.filter(name=>!decisions[name]),badDecision=required.filter(name=>decisions[name]&&decisions[name].passed!==decisions[name].total);if(missing.length||badDecision.length)throw new Error(`Decision groups incomplete: missing=${missing.join(',')} bad=${badDecision.join(',')}`);
          for(const count of [100,500,1000])if(!decisionPerf.some(line=>line.includes(`count=${count} `)))throw new Error(`Missing decision performance marker ${count}`);
          const lines=[`browser=${browser}`,`exact_sha=${process.env.CERTIFIED_SHA}`,`passed=${passed}`,`failed=${failed}`,`skipped=${skipped}`,`flaky=${flaky}`,'retries=0',`internal=${internal[1]}/${internal[2]}`,`evidence_comparison=${internal[3]}`,`decision_groups=${decisionGroups[1]}`,`rule_groups=${ruleGroups[1]}`,...decisionPerf];fs.writeFileSync(`reports/${browser}-certification-summary.txt`,lines.join('\n')+'\n');console.log(lines.join('\n'));
          NODE
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-462-${{ matrix.browser }}-evidence
          path: |
            verify-440/reports
            verify-440/test-results
          if-no-files-found: warn
          retention-days: 30

  release_package:
    name: Build authenticated LifeOS 4.6.2 package
    needs: [exact_source, static, browser]
    if: needs.exact_source.result == 'success' && needs.static.result == 'success' && needs.browser.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      CERTIFIED_SHA: ${{ needs.exact_source.outputs.certified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.exact_source.outputs.certified_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: lifeos-462-*-evidence
          path: certification-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: lifeos-462-static-qa
          path: static-evidence
      - name: Re-run behavioral static QA
        run: node scripts/static-qa-462.mjs
      - name: Build synchronized release assets
        env:
          LIFEOS_SOURCE_SHA: ${{ needs.exact_source.outputs.certified_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          LIFEOS_RELEASE_TAG: v4.6.2
        run: node scripts/build-release-462.mjs
      - name: Verify exact-SHA browser summaries
        shell: bash
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            file="$(find certification-evidence -name "${browser}-certification-summary.txt" -print -quit)"
            test -n "$file"
            grep -F "exact_sha=${CERTIFIED_SHA}" "$file"
            grep -F 'passed=102' "$file"
            grep -F 'failed=0' "$file"
            grep -F 'skipped=0' "$file"
            grep -F 'flaky=0' "$file"
            grep -F 'retries=0' "$file"
            grep -F 'evidence_comparison=7/7' "$file"
            grep -F 'decision_groups=' "$file"
          done
      - name: Create archive, hashes, provenance and certification report
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && zip -r -9 ../LifeOS_4_6_2_Master_Spec_Release.zip .)
          cp dist/SHA256SUMS.txt FINAL_SHA256SUMS_4_6_2.txt
          sha256sum LifeOS_4_6_2_Master_Spec_Release.zip >> FINAL_SHA256SUMS_4_6_2.txt
          sha256sum app.js decision-engine.js app.css index.html service-worker.js planning-worker.js manifest.webmanifest >> FINAL_SHA256SUMS_4_6_2.txt
          sha256sum dist/BUILD_PROVENANCE.json >> FINAL_SHA256SUMS_4_6_2.txt
          find certification-evidence -type f -print0 | sort -z | xargs -0 sha256sum >> FINAL_SHA256SUMS_4_6_2.txt
          cat > LIFEOS_4_6_2_FINAL_MASTER_SPEC_REPORT.md <<EOF
          # LifeOS 4.6.2 — Master-Spec Certification Completion
          ## Exact-SHA Final Certification

          - Repository: ${GITHUB_REPOSITORY}
          - Exact certified source SHA: ${CERTIFIED_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - APP_VERSION: 4.6.2
          - DECISION_ENGINE_VERSION: 4.6.2
          - RuleEngine: 4.5.1 preserved
          - Intelligence: 4.4.2 preserved
          - Calendar: 4.3.0 preserved
          - Forecast: 4.2.0 preserved
          - Scheduler: 4.1.0 preserved
          - DB schema: 16 preserved

          ### Full-master-spec completion gates
          - Dedicated internal Decision self-test groups: PASS
          - Two-tab Decision Apply E2E / one logical mutation: PASS
          - Keyboard-only choose → Preview → Apply → Undo: PASS
          - Offline Analyze → Preview → Apply → Undo: PASS
          - Visible CURRENT vs PROPOSED Preview: PASS
          - Visible forecast-effect panel: PASS
          - Visible quantified opportunity-cost panel: PASS
          - Morning Decision Brief: PASS
          - End-of-Day Decision Review: PASS
          - Decision outcome / follow-up: PASS

          ### Retained Decision correctness
          - Whole-day multi-task planning: PASS
          - Deadline triage: PASS
          - Project allocation: PASS
          - DEFERRAL / WEEK_PRIORITY / SCHEDULE_CONFLICT: PASS
          - Recovery / Stability / ContextSwitch / ProjectAllocator integration: PASS
          - Hard RuleEngine constraints and fail-closed feasibility: PASS
          - Before/after forecast and quantified opportunity cost: PASS
          - Scenario Apply safety: PASS

          ### Certification
          - Behavioral static QA: PASS
          - Internal deterministic suite: 509/509 or better, including all Decision groups
          - Chromium: 102/102 PASS, retries 0
          - Firefox: 102/102 PASS, retries 0
          - WebKit: 102/102 PASS, retries 0
          - Cross-browser total: 306/306 PASS
          - PWA / Standalone app parity: PASS
          - PWA / Standalone Decision Engine parity: PASS
          - SHA-256 manifest: PASS
          - Build provenance exact-SHA binding: PASS
          EOF
      - name: Upload authenticated release package
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-462-final-release-package
          path: |
            LifeOS_4_6_2_Master_Spec_Release.zip
            dist/LifeOS_4_6_2_Master_Spec_Standalone.html
            dist/BUILD_PROVENANCE.json
            FINAL_SHA256SUMS_4_6_2.txt
            LIFEOS_4_6_2_FINAL_MASTER_SPEC_REPORT.md
          retention-days: 90
      - name: Publish v4.6.2 only from certified main SHA
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${CERTIFIED_SHA}"
          test "$(git rev-parse origin/main)" = "${CERTIFIED_SHA}"
          if gh release view v4.6.2 >/dev/null 2>&1; then
            EXISTING="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v4.6.2 --jq '.object.sha')"
            test "$EXISTING" = "$CERTIFIED_SHA"
            gh release upload v4.6.2 --clobber LifeOS_4_6_2_Master_Spec_Release.zip dist/LifeOS_4_6_2_Master_Spec_Standalone.html FINAL_SHA256SUMS_4_6_2.txt dist/BUILD_PROVENANCE.json LIFEOS_4_6_2_FINAL_MASTER_SPEC_REPORT.md
          else
            gh release create v4.6.2 --target "$CERTIFIED_SHA" --title 'LifeOS 4.6.2 — Master-Spec Certification Completion' --notes-file LIFEOS_4_6_2_FINAL_MASTER_SPEC_REPORT.md LifeOS_4_6_2_Master_Spec_Release.zip dist/LifeOS_4_6_2_Master_Spec_Standalone.html FINAL_SHA256SUMS_4_6_2.txt dist/BUILD_PROVENANCE.json LIFEOS_4_6_2_FINAL_MASTER_SPEC_REPORT.md
          fi
