name: Fix 4.6.2 generator interpolation
on:
  push:
    branches:
      - feature/lifeos-462-master-spec-certification
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lifeos-462-master-spec-certification
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace nested generator template with inert encoded source
        run: |
          node <<'NODE'
          const fs=require('fs'),path='scripts/upgrade-lifeos-462-master-spec.mjs';let s=fs.readFileSync(path,'utf8');
          const start=s.indexOf('const recordReplacement=`'),end=s.indexOf(';\ndecision=replaceSpan(decision,recordStart,recordEnd,recordReplacement);',start);
          if(start<0||end<0)throw new Error('generator recordReplacement span not found');
          const fixed="const recordReplacement=decode('');";
          s=s.slice(0,start)+fixed+s.slice(end+1);fs.writeFileSync(path,s);
          NODE
          node --check scripts/upgrade-lifeos-462-master-spec.mjs
          git diff --check
      - name: Commit repaired generator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/upgrade-lifeos-462-master-spec.mjs
          git commit -m 'fix(4.6.2): make generator record source interpolation-safe'
          git push origin HEAD:feature/lifeos-462-master-spec-certification
