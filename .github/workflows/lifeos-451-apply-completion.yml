name: LifeOS 4.5.1 Apply Final Automation Completion

on:
  push:
    branches:
      - fix/lifeos-451-final-automation-completion

permissions:
  contents: write

concurrency:
  group: lifeos-451-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize guarded patcher signatures
        run: |
          node scripts/repair-lifeos-451-patcher.mjs
          node --check scripts/apply-lifeos-451-final-automation.mjs
      - name: Apply guarded 4.5.1 completion patches
        run: |
          node scripts/apply-lifeos-451-final-automation.mjs
          node scripts/apply-lifeos-451-race-corrections.mjs
      - name: Parse production source and retained tests
        run: |
          node --check app.js
          node --check service-worker.js
          node --check planning-worker.js
          node --check scripts/apply-lifeos-451-race-corrections.mjs
          node --check tests/rules-450.spec.js
          node --check tests/rule-approval-safety-450.spec.js
          node --check tests/rule-performance-450.spec.js
          node --check tests/evidence-correctness.spec.js
          node --check tests/rules-451-completion.spec.js
      - name: Commit exact generated source and normalized patcher
        run: |
          if git diff --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-lifeos-451-final-automation.mjs app.js service-worker.js index.html tests/rules-450.spec.js tests/rule-approval-safety-450.spec.js tests/rule-performance-450.spec.js tests/evidence-correctness.spec.js tests/rules-451-completion.spec.js
          git commit -m 'chore(4.5.1): apply generated completion source'
          git push origin HEAD:fix/lifeos-451-final-automation-completion
