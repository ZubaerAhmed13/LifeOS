name: LifeOS 4.6.1 Firefox Web Lock Hardening

on:
  push:
    branches:
      - feature/lifeos-461-decision-planning-completion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifeos-461-firefox-lock-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden queued Web Lock and in-lock Decision revalidation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const replace=(source,from,to,label)=>{
            if(source.includes(to)) return source;
            if(!source.includes(from)) throw new Error(`4.6.1 Firefox lock hardening failed: ${label}`);
            return source.replace(from,to);
          };

          let app=fs.readFileSync('app.js','utf8');
          app=replace(
            app,
            "async withExclusiveLock(label,operation){const name='lifeos:data-critical';if(globalThis.navigator?.locks?.request)return navigator.locks.request(name,{mode:'exclusive',ifAvailable:true},async lock=>{if(!lock)throw CoreUtil.error('CROSS-TAB-LOCK-001',`${label} is already running in another LifeOS window.`,{operation:label});this.currentOperation=label;try{return await operation()}finally{this.currentOperation=''}});return this.withFallbackLease(label,operation)}",
            "async withExclusiveLock(label,operation){const name='lifeos:data-critical';if(globalThis.navigator?.locks?.request)return navigator.locks.request(name,{mode:'exclusive'},async lock=>{if(!lock)throw CoreUtil.error('CROSS-TAB-LOCK-001',`${label} could not acquire the LifeOS data lock.`,{operation:label});this.currentOperation=label;try{return await operation()}finally{this.currentOperation=''}});return this.withFallbackLease(label,operation)/* WEB-LOCK-QUEUE-461 */}",
            'queued exclusive Web Lock acquisition'
          );
          fs.writeFileSync('app.js',app);

          let decision=fs.readFileSync('decision-engine.js','utf8');
          decision=replace(
            decision,
            "const candidate=choice.candidate,op=async()=>{if(['plan-repair','schedule-conflict-plan'].includes(candidate.kind)){const preview=await this.app.service.buildRepair(fresh.context.decisionDate,{maxRadius:Math.max(4,num(candidate.repairRadius,1))});",
            "const candidate=choice.candidate,op=async()=>{const lockedFresh=await this.revalidate(decision);if(!lockedFresh.fresh){const error=new Error('This recommendation is out of date because the underlying plan changed while waiting for the data lock.');error.code='DECISION-STALE-461';throw error}const lockedFeasibility=new DecisionFeasibilityGate().evaluate(candidate,lockedFresh.context);if(!lockedFeasibility.feasible){const error=new Error('This recommendation is no longer feasible under the current hard constraints.');error.code='DECISION-REVALIDATION-461';error.details={blockers:lockedFeasibility.blockers,evidence:lockedFeasibility.evidence};throw error}const executionContext=lockedFresh.context;if(['plan-repair','schedule-conflict-plan'].includes(candidate.kind)){const preview=await this.app.service.buildRepair(executionContext.decisionDate,{maxRadius:Math.max(4,num(candidate.repairRadius,1))});",
            'in-lock Decision revalidation'
          );
          decision=decision.replaceAll('this.planChanges(decision,choice,fresh.context)','this.planChanges(decision,choice,executionContext)');
          decision=decision.replaceAll('this.deferralChanges(candidate,fresh.context)','this.deferralChanges(candidate,executionContext)');
          decision=decision.replaceAll('const task=fresh.context.tasks.find(t=>t.id===candidate.taskId);','const task=executionContext.tasks.find(t=>t.id===candidate.taskId);');
          if(!decision.includes('lockedFresh=await this.revalidate(decision)')) throw new Error('Missing in-lock revalidation marker.');
          if(!app.includes('WEB-LOCK-QUEUE-461')) throw new Error('Missing queued Web Lock marker.');
          fs.writeFileSync('decision-engine.js',decision);
          NODE
          node --check app.js
          node --check decision-engine.js
          node scripts/static-qa-461.mjs
      - name: Commit production lock hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js decision-engine.js; then
            echo 'Firefox Web Lock hardening already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js decision-engine.js
          git commit -m 'fix(4.6.1): queue Web Locks and revalidate decisions in-lock'
          git push origin HEAD:${GITHUB_REF_NAME}
