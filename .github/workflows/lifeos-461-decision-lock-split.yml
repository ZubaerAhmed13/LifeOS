name: LifeOS 4.6.1 Decision Lock Split

on:
  push:
    branches:
      - feature/lifeos-461-decision-planning-completion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifeos-461-decision-lock-split
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Split fail-fast rule lock from queued Decision lock
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const replace=(source,from,to,label)=>{
            if(source.includes(to)) return source;
            if(!source.includes(from)) throw new Error(`4.6.1 Decision lock split failed: ${label}`);
            return source.replace(from,to);
          };

          let app=fs.readFileSync('app.js','utf8');
          app=replace(
            app,
            "    async withExclusiveLock(label,operation){const name='lifeos:data-critical';if(globalThis.navigator?.locks?.request)return navigator.locks.request(name,{mode:'exclusive'},async lock=>{if(!lock)throw CoreUtil.error('CROSS-TAB-LOCK-001',`${label} could not acquire the LifeOS data lock.`,{operation:label});this.currentOperation=label;try{return await operation()}finally{this.currentOperation=''}});return this.withFallbackLease(label,operation)/* WEB-LOCK-QUEUE-461 */}",
            "    async withExclusiveLock(label,operation){const name='lifeos:data-critical';if(globalThis.navigator?.locks?.request)return navigator.locks.request(name,{mode:'exclusive',ifAvailable:true},async lock=>{if(!lock)throw CoreUtil.error('CROSS-TAB-LOCK-001',`${label} is already running in another LifeOS window.`,{operation:label});this.currentOperation=label;try{return await operation()}finally{this.currentOperation=''}});return this.withFallbackLease(label,operation)}\n    async withQueuedExclusiveLock(label,operation){const name='lifeos:data-critical';if(globalThis.navigator?.locks?.request)return navigator.locks.request(name,{mode:'exclusive'},async lock=>{if(!lock)throw CoreUtil.error('CROSS-TAB-LOCK-001',`${label} could not acquire the LifeOS data lock.`,{operation:label});this.currentOperation=label;try{return await operation()}finally{this.currentOperation=''}});return this.withFallbackLease(label,operation)/* DECISION-WEB-LOCK-QUEUE-461 */}",
            'preserve fail-fast RuleEngine lock and add queued Decision lock'
          );
          fs.writeFileSync('app.js',app);

          let decision=fs.readFileSync('decision-engine.js','utf8');
          decision=replace(
            decision,
            "return this.app.operationLocks?this.app.operationLocks.withExclusiveLock('Decision apply',op):op()",
            "return this.app.operationLocks?.withQueuedExclusiveLock?this.app.operationLocks.withQueuedExclusiveLock('Decision apply',op):this.app.operationLocks?this.app.operationLocks.withExclusiveLock('Decision apply',op):op()",
            'Decision-only queued lock routing'
          );
          if(!decision.includes('lockedFresh=await this.revalidate(decision)')) throw new Error('In-lock Decision revalidation was lost.');
          if(!app.includes('DECISION-WEB-LOCK-QUEUE-461')) throw new Error('Queued Decision lock marker missing.');
          if(!app.includes("ifAvailable:true")) throw new Error('Fail-fast legacy lock behavior was not preserved.');
          fs.writeFileSync('decision-engine.js',decision);
          NODE
          node --check app.js
          node --check decision-engine.js
          node scripts/static-qa-461.mjs
      - name: Commit Decision lock split
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js decision-engine.js; then
            echo 'Decision lock split already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js decision-engine.js
          git commit -m 'fix(4.6.1): isolate queued Decision lock from RuleEngine'
          git push origin HEAD:${GITHUB_REF_NAME}
