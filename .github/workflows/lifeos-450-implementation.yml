name: LifeOS 4.5 Implementation Gate

on:
  push:
    branches:
      - feature/lifeos-450-rules-automation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifeos-450-implementation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize App constructor generator guard
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/apply-lifeos-450-core.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const replacement = `if(!app.includes("this.ruleEngine=null;this.pendingRuleSuggestion=null;this.ruleTestResult=null")) app = replaceOnce(app, "this.calendarScenarioUndo=[];this.calendarFocusKey=''}", "this.calendarScenarioUndo=[];this.calendarFocusKey='';this.ruleEngine=null;this.pendingRuleSuggestion=null;this.ruleTestResult=null}", 'App rule state');`;
          const pattern = /^.*app = replaceOnce\(app, "this\.calendarScenarioUndo=\[\];this\.calendarFocusKey=''\}", "this\.calendarScenarioUndo=\[\];this\.calendarFocusKey='';this\.ruleEngine=null;this\.pendingRuleSuggestion=null;this\.ruleTestResult=null\}", 'App rule state'\);$/m;
          if (!pattern.test(source)) throw new Error('Expected App constructor generator signature not found.');
          const next = source.replace(pattern, replacement);
          if (next !== source) {
            fs.writeFileSync(path, next);
            console.log('Normalized App constructor generator guard.');
          } else {
            console.log('App constructor generator guard already normalized.');
          }
          NODE
      - name: Remove ambiguous cosmetic settings anchor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/apply-lifeos-450-ui-tests-v2.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const marker = '// Rule engine identity is verified by globals and certification; settings row insertion intentionally omitted.';
          if (!source.includes(marker)) {
            const lines = source.split('\n');
            const next = lines.filter(line => !line.includes("'Settings Rule Engine identity'"));
            if (next.length === lines.length) throw new Error('Expected settings-only patch signature not found.');
            source = next.join('\n').replace("app=insertBeforeOnce(app,'    async run(){this.results=[];'", marker + "\napp=insertBeforeOnce(app,'    async run(){this.results=[];'");
            fs.writeFileSync(path, source);
            console.log('Removed ambiguous settings-only patch anchor.');
          } else {
            console.log('Ambiguous settings-only patch already removed.');
          }
          NODE
      - name: Normalize release-correction insertion anchors
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/apply-lifeos-450-release-corrections.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldDecl = "const planningAnchor='    async planningPolicies(){';";
          const newDecl = "const fragmentPlanningAnchor='    async planningPolicies(){';\nconst appPendingAnchor=\"    async save(rule){return this.repo.save('rules',DataValidator.rule(rule))}\";";
          if (source.includes(oldDecl)) source = source.replace(oldDecl, newDecl);
          source = source.replace('const cut=safety.indexOf(planningAnchor);', 'const cut=safety.indexOf(fragmentPlanningAnchor);');
          source = source.replace("app=insertBefore(app,planningAnchor,pendingMethods,\"async pendingApprovals(){\",'RuleEngine pending approval methods');", "app=insertBefore(app,appPendingAnchor,pendingMethods,\"async pendingApprovals(){\",'RuleEngine pending approval methods');");
          if (!source.includes('fragmentPlanningAnchor') || !source.includes('appPendingAnchor')) throw new Error('Release-correction anchor normalization failed.');
          fs.writeFileSync(path, source);
          NODE
      - name: Apply guarded 4.5 core patch
        run: node scripts/apply-lifeos-450-core.mjs
      - name: Apply guarded 4.5 UI and base test patch
        run: node scripts/apply-lifeos-450-ui-tests-v2.mjs
      - name: Apply required Rule Actions and Rule Notifications self-tests
        run: node scripts/apply-lifeos-450-test-completion.mjs
      - name: Apply release approval and safe-scheduling corrections
        run: node scripts/apply-lifeos-450-release-corrections.mjs
      - name: Parse generated production JavaScript
        run: |
          node --check app.js
          node --check service-worker.js
          node --check planning-worker.js
      - name: Verify release identity and safety invariants
        run: |
          grep -F "const APP_VERSION='4.5.0';" app.js
          grep -F "const RULE_ENGINE_VERSION='4.5.0';" app.js
          grep -F "const DB_SCHEMA_VERSION=16;" app.js
          grep -F "const INTELLIGENCE_MODEL_VERSION='4.4.2';" app.js
          grep -F "class RuleEngine{" app.js
          grep -F "Rules & Automation" app.js
          grep -F "async runRule450Tests(repo)" app.js
          grep -F "this.test('Rule Actions','registry actions are structured" app.js
          grep -F "this.test('Rule Notifications','same logical notification" app.js
          grep -F "earliestTomorrowSlot(task,context)" app.js
          grep -F "async pendingApprovals(){" app.js
          grep -F "confirmed=false" app.js
          grep -F "currentProposal=plan.proposedActions" app.js
          grep -F "<h2>Awaiting approval</h2>" app.js
          ! grep -E '\beval\s*\(' app.js
          ! grep -E '\bnew\s+Function\s*\(' app.js
      - name: Commit generated 4.5 source when needed
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Guarded patch is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css service-worker.js index.html manifest.webmanifest \
            scripts/apply-lifeos-450-core.mjs scripts/apply-lifeos-450-ui-tests-v2.mjs \
            scripts/apply-lifeos-450-test-completion.mjs scripts/apply-lifeos-450-release-corrections.mjs \
            scripts/fragments/lifeos-450-tests.jsfrag scripts/fragments/lifeos-450-safety-methods.jsfrag \
            scripts/fragments/lifeos-450-pending-ui.jsfrag
          git commit -m "chore: stabilize LifeOS 4.5 guarded generators"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Gate result
        run: |
          echo "Implementation changed source: ${{ steps.commit.outputs.changed }}"
          echo "Head input SHA: $GITHUB_SHA"
