name: LifeOS 4.6.2 One-Shot Firefox Reset Harness Repair

on:
  push:
    branches:
      - verify-lifeos-440-ci
    paths:
      - .github/workflows/lifeos-462-firefox-reset-harness-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-lifeos-440-ci
          fetch-depth: 0
      - name: Make onboarding persistence poll navigation-safe
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'verify-440/stabilize-harness.cjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldValue = "    return page.evaluate(async () => Boolean((await globalThis.LifeOS.app.repo.settings()).onboardingComplete));\\n  }, { timeout: 15_000 }).toBe(true);\\n  await expect(onboarding).not.toBeVisible();";
          const newValue = "    return page.evaluate(async () => {\\n      const repo = globalThis.LifeOS?.app?.repo;\\n      if (!repo) return false;\\n      return Boolean((await repo.settings()).onboardingComplete);\\n    }).catch(() => false);\\n  }, { timeout: 15_000 }).toBe(true);\\n  await waitForApp(page);\\n  await expect(onboarding).not.toBeVisible();";
          if (source.includes(newValue)) {
            console.log('Navigation-safe onboarding poll already present.');
          } else {
            const first = source.indexOf(oldValue);
            if (first < 0) throw new Error('Unsafe onboarding poll signature not found.');
            if (source.indexOf(oldValue, first + oldValue.length) >= 0) throw new Error('Unsafe onboarding poll signature is not unique.');
            source = source.replace(oldValue, newValue);
            fs.writeFileSync(path, source);
            console.log('Patched onboarding persistence poll to tolerate service-worker navigation replacement.');
          }
          NODE
          node --check verify-440/stabilize-harness.cjs
          grep -F "const repo = globalThis.LifeOS?.app?.repo;" verify-440/stabilize-harness.cjs
          grep -F "await waitForApp(page);" verify-440/stabilize-harness.cjs
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lifeos-462-firefox-reset-harness-repair.yml
          git add verify-440/stabilize-harness.cjs
          git diff --cached --check
          git commit -m "test(cert): make Firefox reset onboarding poll navigation-safe"
          git push origin HEAD:verify-lifeos-440-ci
